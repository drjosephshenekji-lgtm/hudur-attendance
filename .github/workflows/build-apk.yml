name: بناء APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: تسمية الملف
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hudur-attendance.apk"
          ls -la out

      - name: رفع الملف كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: hudur-apk
          path: out/hudur-attendance.apk
          retention-days: 90

      - name: نشر إصدار للتنزيل المباشر
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" "out/hudur-attendance.apk" \
            --title "تفقّد الحضور $TAG" \
            --notes "ملف APK جاهز للتثبيت على اندرويد. نزّله من الأسفل." \
            --repo "${{ github.repository }}" || \
          gh release upload "$TAG" "out/hudur-attendance.apk" --clobber --repo "${{ github.repository }}"
